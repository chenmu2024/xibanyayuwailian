name: Validate backlink repository

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/validate_csv.py'
      - 'scripts/validate_workbench.mjs'
      - 'docs/all-176-backlink-submission-methods.md'
      - 'docs/lettering-priority-21-ready-to-fill.md'
      - 'docs/backlink-submission-workbench.html'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate_csv.py'
      - 'scripts/validate_workbench.mjs'
      - 'docs/all-176-backlink-submission-methods.md'
      - 'docs/lettering-priority-21-ready-to-fill.md'
      - 'docs/backlink-submission-workbench.html'
      - '.github/workflows/validate-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate historical CSV and filing documents
        run: python3 scripts/validate_csv.py
      - name: Verify offline workbench JSON, JS syntax and domain isolation
        run: node scripts/validate_workbench.mjs
