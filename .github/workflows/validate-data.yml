name: Validate backlink CSV data
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/validate_csv.py'
      - 'docs/backlink-submission-workbench.html'
      - 'docs/workbench-quickstart-v28.md'
      - 'docs/all-176-backlink-submission-methods.md'
      - 'docs/lettering-priority-21-ready-to-fill.md'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate_csv.py'
      - 'docs/backlink-submission-workbench.html'
      - 'docs/workbench-quickstart-v28.md'
      - 'docs/all-176-backlink-submission-methods.md'
      - 'docs/lettering-priority-21-ready-to-fill.md'
      - '.github/workflows/validate-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Python standard library
        run: python3 scripts/validate_csv.py
