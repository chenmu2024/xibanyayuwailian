name: Validate backlink repository

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/validate_csv.py'
      - 'scripts/validate_workbench.mjs'
      - 'scripts/smoke_workbench.mjs'
      - 'scripts/verify_published_backlink.py'
      - 'scripts/test_verify_published_backlink.py'
      - 'scripts/audit_p1_published_links.py'
      - 'scripts/test_audit_p1_published_links.py'
      - 'scripts/audit_curated_v52.py'
      - 'scripts/test_audit_curated_v52.py'
      - 'docs/all-176-backlink-submission-methods.md'
      - 'docs/lettering-priority-21-ready-to-fill.md'
      - 'docs/backlink-submission-workbench.html'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate_csv.py'
      - 'scripts/validate_workbench.mjs'
      - 'scripts/smoke_workbench.mjs'
      - 'scripts/verify_published_backlink.py'
      - 'scripts/test_verify_published_backlink.py'
      - 'scripts/audit_p1_published_links.py'
      - 'scripts/test_audit_p1_published_links.py'
      - 'scripts/audit_curated_v52.py'
      - 'scripts/test_audit_curated_v52.py'
      - 'docs/all-176-backlink-submission-methods.md'
      - 'docs/lettering-priority-21-ready-to-fill.md'
      - 'docs/backlink-submission-workbench.html'
      - '.github/workflows/validate-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate historical CSV and filing documents
        run: python3 scripts/validate_csv.py
      - name: Verify offline workbench JSON, JS syntax and domain isolation
        run: node scripts/validate_workbench.mjs
      - name: Smoke test offline search, per-site progress and backup restore
        run: node scripts/smoke_workbench.mjs
      - name: Test published backlink verifier without network
        run: python3 -m unittest discover -s scripts -p "test_verify_published_backlink.py" -v
      - name: Test P1 third-party raw-link audit without network
        run: python3 -m unittest discover -s scripts -p "test_audit_p1_published_links.py" -v
      - name: Test curated V52 raw-link audit without network
        run: python3 -m unittest discover -s scripts -p "test_audit_curated_v52.py" -v
